# Render blueprint for the Shikaar FastAPI backend.
# In Render: New > Blueprint, point at this repo. Then set the secret env vars
# (marked sync:false) in the dashboard. Free plan sleeps when idle (cold start
# ~30s) and its disk is ephemeral — fine for a demo; inventory resets on restart.
services:
  - type: web
    name: shikaar-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: OPENAI_API_KEY
        sync: false
      - key: PINECONE_API_KEY
        sync: false
      - key: PINECONE_HOST
        sync: false
      # Demo mode (per-browser freezers behind one shared password). Leave this
      # set OR switch to accounts mode below — not both.
      - key: SHIKAAR_ACCESS_PASSWORD
        sync: false
      # Accounts mode: enable real per-user sign-in + durable storage.
      # When these are set, unset SHIKAAR_ACCESS_PASSWORD.
      #   SUPABASE_URL  = https://<project-ref>.supabase.co  (used to fetch the
      #     project's JWKS and verify ES256 tokens — the default for new projects).
      #   DATABASE_URL  = Supabase connection string (Session pooler).
      #   SUPABASE_JWT_SECRET = ONLY for older projects that still sign tokens
      #     with the legacy HS256 shared secret; new (ECC/ES256) projects omit it.
      - key: SUPABASE_URL
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      # Daily cap per user on AI actions (parse, photo, meal plan, ask) to keep
      # the OpenAI bill in check. 0 turns it off.
      - key: AI_DAILY_LIMIT
        value: "20"
